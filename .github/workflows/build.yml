name: Build Android

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r21e

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.3

      - name: Restore Haxe Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.haxelib
            .haxelib
          key: ${{ runner.os }}-haxe-${{ hashFiles('**/hmm.json') }}
          restore-keys: |
            ${{ runner.os }}-haxe-

      - name: Install HMM and Dependencies from hmm.json
        run: |
          haxelib install hmm --quiet
          haxelib run hmm install

      - name: Configure Lime Android SDK Path
        run: |
          haxelib run lime config ANDROID_SDK $ANDROID_HOME
          haxelib run lime config ANDROID_NDK_ROOT $ANDROID_NDK_HOME
          haxelib run lime config JAVA_HOME $JAVA_HOME

      - name: Build Android APK
        run: |
          haxelib run lime build android -release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Funkin-Android-Build
          path: export/release/android/bin/app/build/outputs/apk/release/*.apk
