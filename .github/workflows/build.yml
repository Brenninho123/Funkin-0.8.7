name: Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  HAXE_VERSION: 4.3.7

jobs:
  android:
    name: Android (${{ matrix.name }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # One APK containing both ABIs, installs on any ARM Android device.
          - name: universal
            arch_flags: "-armv7 -arm64"
          # 32-bit ARM only (armeabi-v7a).
          - name: armeabi-v7a
            arch_flags: "-armv7"
          # 64-bit ARM only (arm64-v8a).
          - name: arm64
            arch_flags: "-arm64"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Cache Android SDK packages
        id: cache-android-sdk
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_SDK_ROOT }}/ndk
            ${{ env.ANDROID_SDK_ROOT }}/platforms
            ${{ env.ANDROID_SDK_ROOT }}/build-tools
          key: android-sdk-ndk27.2.12479018-platform35-buildtools35.0.0

      - name: Install Android SDK
        if: steps.cache-android-sdk.outputs.cache-hit != 'true'
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"

      - name: Configure Android
        shell: bash
        run: |
          echo "ANDROID_SDK=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "CXXFLAGS=-std=c++20" >> "$GITHUB_ENV"

      - name: Install Linux dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libdbus-1-dev \
            libasound2-dev \
            libudev-dev \
            libpipewire-0.3-dev \
            libpulse-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libwayland-bin \
            wayland-protocols \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxss-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            pkg-config

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: ${{ env.HAXE_VERSION }}

      - name: Cache haxelib
        id: cache-haxelib
        uses: actions/cache@v4
        with:
          path: .haxelib
          key: haxelib-android-${{ hashFiles('hmm.json') }}
          restore-keys: |
            haxelib-android-

      - name: Install HMM
        shell: bash
        run: haxelib install hmm --quiet

      - name: Install dependencies
        shell: bash
        run: haxelib run hmm install

      - name: Build hxcpp
        if: steps.cache-haxelib.outputs.cache-hit != 'true'
        shell: bash
        run: |
          HXCPP_PATH=$(haxelib libpath hxcpp | tr -d '\n')
          cd "$HXCPP_PATH/tools/hxcpp"
          haxe compile.hxml

      - name: Rebuild Lime
        if: steps.cache-haxelib.outputs.cache-hit != 'true'
        shell: bash
        run: haxelib run lime rebuild cpp

      - name: Setup Lime Android
        shell: bash
        run: |
          haxelib run lime setup android <<EOF
          $ANDROID_SDK_ROOT
          $ANDROID_NDK_ROOT
          $JAVA_HOME
          EOF

      - name: Rebuild Lime Android
        if: steps.cache-haxelib.outputs.cache-hit != 'true'
        shell: bash
        run: haxelib run lime rebuild android -armv7 -arm64

      - name: Build Android (${{ matrix.name }})
        shell: bash
        run: haxelib run lime build android ${{ matrix.arch_flags }} -release -DGITHUB_BUILD

      # Release APKs come out unsigned, which Android refuses to install.
      # Sign them with a throwaway key so they can be sideloaded.
      - name: Sign APK
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          APK_IN=$(find export/release/android -name "*.apk" | head -n 1)
          if [ -z "$APK_IN" ]; then echo "No APK found"; exit 1; fi
          echo "Input APK: $APK_IN"

          keytool -genkeypair -v -keystore ci.keystore -alias funkin \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass funkin123 -keypass funkin123 \
            -dname "CN=Funkin CI, O=Funkin, C=US"

          mkdir -p dist
          "$BUILD_TOOLS/zipalign" -f -p 4 "$APK_IN" aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks ci.keystore --ks-key-alias funkin \
            --ks-pass pass:funkin123 --key-pass pass:funkin123 \
            --out "dist/Funkin-0.8.7-${{ matrix.name }}.apk" aligned.apk
          "$BUILD_TOOLS/apksigner" verify "dist/Funkin-0.8.7-${{ matrix.name }}.apk"
          ls -lh dist

      - name: Upload Android (${{ matrix.name }})
        uses: actions/upload-artifact@v4
        with:
          name: Funkin-Android-${{ matrix.name }}
          path: dist/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
